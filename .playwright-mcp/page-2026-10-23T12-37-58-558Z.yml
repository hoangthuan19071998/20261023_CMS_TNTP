                - generic [ref=f6e190]: "1"
                - generic [ref=f6e191]: Sáng 22/10, tại Hà Nội, hội thảo về chuyển đổi số trong lĩnh vực báo chí đã thu hút hơn 200 đại biểu đến từ các cơ quan báo chí trung ương và địa phương trên toàn quốc.
              - paragraph [ref=f6e192]:
                - generic [ref=f6e193]: "2"
                - generic [ref=f6e194]: Theo báo cáo khảo sát được công bố tại hội thảo, tỷ lệ cơ quan báo chí đã triển khai tòa soạn hội tụ ở mức một phần ba, trong đó phần lớn tập trung ở các cơ quan báo chí có quy mô lớn.
              - paragraph [ref=f6e195]:
                - generic [ref=f6e196]: "3"
                - generic [ref=f6e197]: Đại diện ban tổ chức cho biết khó khăn lớn nhất không nằm ở hạ tầng công nghệ mà ở việc thay đổi quy trình làm việc, khi nhiều khâu biên tập và lưu trữ vẫn xử lý trên giấy.
              - paragraph [ref=f6e198]:
                - generic [ref=f6e199]: "4"
                - generic [ref=f6e200]: "Phiên thảo luận buổi chiều tập trung vào bài toán tối ưu luồng quy trình: làm thế nào rút ngắn thời gian từ lúc phóng viên gửi bài đến khi duyệt xuất bản mà vẫn giữ đủ các lớp kiểm soát."
              - paragraph [ref=f6e201]:
                - generic [ref=f6e202]: "5"
                - generic [ref=f6e203]: Nhiều đại biểu đề xuất cần đẩy mạnh trang bị công cụ hỗ trợ thông minh cho phóng viên, đồng thời tích hợp chặt chẽ việc đo lường dữ liệu bạn đọc vào quy trình sản xuất tin bài.
